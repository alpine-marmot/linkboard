<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Startseite</title>
<style>
:root{--bg:#181818;--panel:#30302e;--line:#454542;--txt:#efede6;--mute:#a09e96;--acc:#7fb3d5;--hov:#3b3b38;--th:52px;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f3ee;--panel:#ffffff;--line:#dad8cf;--txt:#1f1e1d;--mute:#6b6962;--acc:#4a90c2;--hov:#ebe9e2;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#q{flex:1 1 70px;min-width:70px;max-width:460px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);outline:none}
#q:focus,.ct:focus{border-color:var(--acc)}
#dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.dot.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--bg) inset}
.sp{flex:1}
.btn{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10202c;font-weight:600}
#wx{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;white-space:nowrap}
#wx:hover{background:var(--panel)}
#wx b{font-size:1.25rem;font-weight:600}
#wx small{color:var(--mute);display:block;line-height:1.1}
#board{display:flex;flex-direction:column;gap:28px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;align-items:start;min-height:24px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bt{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:600;font-size:1.2rem;outline:none}
body.edit .bt{border-color:var(--line)}
.bt:focus{border-color:var(--acc)}
.sel,.nsel{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:3px 2px;font-size:.78rem;width:80px;flex:none}
.hint{grid-column:1/-1;color:var(--mute);font-size:.85rem;padding:4px 2px}
.tile.sq{grid-column:auto;height:calc(var(--th)*2 + 8px)}
.tile.sq a{flex-direction:column;justify-content:center;align-self:stretch;text-align:center;gap:8px;padding:10px 8px}
.tile.sq img{width:32px;height:32px;border-radius:8px}
.tile.sq span{white-space:normal;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile.sq .ib{position:absolute;top:3px;right:1px;margin:0}
body.edit .tiles.smart .tile{cursor:auto}
.col{background:var(--panel);border-radius:14px;padding:12px}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ct{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:600;font-size:1rem;outline:none}
body.edit .ct{border-color:var(--line)}
.grip{display:none;cursor:grab;color:var(--mute);padding:0 4px;font-size:1.2rem}
.ib{background:none;border:0;padding:4px 7px;border-radius:7px;color:var(--mute)}
.ib:hover{background:var(--hov);color:var(--txt)}
.ed{display:none}
body.edit .ed,body.edit .grip{display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:14px}
.tile{display:flex;align-items:center;border-radius:10px;overflow:hidden;position:relative;grid-column:1/-1;height:var(--th)}
body.edit .tile{cursor:grab}
.tile a{flex:1;display:flex;align-items:center;gap:10px;padding:11px 13px;color:inherit;text-decoration:none;font-weight:500;min-width:0}
.tile a:hover{filter:brightness(1.12)}
body.edit .tile a{pointer-events:none}
.tile img{width:18px;height:18px;border-radius:4px;flex:none}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ib{color:inherit;opacity:.8;margin-right:4px}
.add{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--mute)}
.add:hover{border-color:var(--acc);color:var(--txt)}
.sortable-ghost{opacity:.35}
#fsbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:.9rem}
#fsbar[hidden],.fsb [hidden]{display:none}
.fsst{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.88rem;margin-bottom:10px}
.fsst i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--mute)}
.fsst.ok i{background:#6fbf73}.fsst.warn i{background:#e0b252}
.fsw{border:1px solid #e0b252;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.88rem;background:rgba(224,178,82,.12)}
.fsw b{display:block;margin-bottom:4px}
.fsb{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.fsb .btn{text-align:left}
#fsdlg{width:min(480px,92vw)}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 14px}
dialog label{display:block;margin-bottom:12px;color:var(--mute);font-size:.85rem}
dialog input:not([type=color]){display:block;width:100%;margin-top:4px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);outline:none}
dialog input:focus{border-color:var(--acc)}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.pal button{padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:none;font-size:.78rem;color:var(--mute)}
.pal button.on{background:var(--acc);border-color:var(--acc);color:#10202c;font-weight:600}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--txt)}
.sw input[type=color]{width:32px;height:28px;padding:0;border:0;background:none}
.row{display:flex;gap:8px;margin-top:16px}
#clk{display:flex;align-items:center;justify-content:center;min-width:72px;padding:6px 6px;border-radius:10px;cursor:pointer;font-size:1.25rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
#clk:hover{background:var(--panel)}
.ap{font-size:.7rem;font-weight:500;color:var(--mute);margin-left:4px}
#cup{color:var(--mute)}
#cup .cb,#cup .ch2,#cup .sa{fill:var(--acc);stroke:none}
#cup .ch2{fill:none;stroke:var(--acc)}
#cup .sa{fill:none;stroke:var(--acc)}
#cup .steam{stroke:var(--mute)}
#cup .steam path{opacity:0;animation:steam 2.4s ease-in-out infinite}
#cup .steam .s2{animation-delay:.8s}
#cup .steam .s3{animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
dialog select{display:block;width:100%;margin-top:4px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}
#ft{padding:8px 20px 22px;text-align:center;font-size:.75rem;color:var(--mute)}
#ft a{color:inherit;text-decoration:none;opacity:.7}
#ft a:hover{opacity:1;text-decoration:underline}
#logo{height:50px;width:auto;flex:none;filter:invert(1);opacity:.92}
:root[data-theme=light] #logo{filter:none;opacity:.9}
.st{position:absolute;right:12px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#9aa0a6;box-shadow:0 0 0 2px rgba(255,255,255,.9);pointer-events:none}
.st.ok{background:#2ea043}
.st.bad{background:#e5484d}
body.edit .tile .st{right:42px}
.tile.sq .st{top:9px;margin-top:0;right:9px}
body.edit .tile.sq .st{right:34px}
.tile a{padding-right:30px}
.tile.sq a{padding:10px 8px}
dialog input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0;padding:0;vertical-align:middle;accent-color:var(--acc)}
dialog label.chk{display:flex;align-items:center;color:var(--txt);font-size:.9rem;cursor:pointer}
#stat{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
#stat svg{display:block;width:21px;height:21px}
#sdlg{width:min(820px,96vw);max-height:90vh;overflow:auto}
#sdlg .sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
#sdlg .sh h3{margin:0;flex:1}
#sdlg .pal{margin:0}
#sdlg h4{margin:18px 0 8px;font-size:.95rem;font-weight:600}
#slink{display:inline-block;width:auto;margin:0 0 0 8px;padding:5px 8px;font-size:.85rem;font-weight:400}
#snote{margin:12px 0 0}
.srow{display:grid;grid-template-columns:minmax(80px,170px) 1fr 44px;gap:10px;align-items:center;width:100%;padding:5px 8px;border:1px solid transparent;border-radius:9px;background:none;text-align:left;font-size:.88rem}
.srow:hover{background:var(--hov)}
.srow.on{border-color:var(--acc)}
.srow .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sbw{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.srow .sbw i{display:block;height:100%;border-radius:6px}
.srow b{text-align:right;font-weight:600}
.sg{stroke:var(--line);stroke-width:1}
.sb{fill:var(--acc)}
.sy,.sx{fill:var(--mute);font-size:11px}
.sv{fill:var(--txt);font-size:11px}
#gear{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
#gear svg{display:block;width:21px;height:21px}
#setdlg{width:min(480px,94vw);max-height:90vh;overflow:auto}
#setdlg .sh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
#setdlg .sh h3{margin:0;flex:1}
#setdlg h4{margin:16px 0 8px;font-size:.95rem;font-weight:600}
#setdlg .pal{margin:0 0 12px}
#setdlg .hint{margin:8px 0 0}
#setdlg label.chk{align-items:flex-start}
#setdlg label.chk input{margin-top:3px}
#setdlg label.chk small{display:block;margin-top:2px;color:var(--mute);font-size:.78rem}
.oa{flex:none;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mute);font-size:.78rem;white-space:nowrap}
.oa:hover{color:var(--txt);border-color:var(--mute)}
body.edit .oa{display:none}
#imdlg{width:min(780px,96vw);max-height:92vh;overflow:auto}
#imdlg .sh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
#imdlg .sh h3{margin:0;flex:1}
#imdlg h4{margin:14px 0 8px;font-size:.95rem;font-weight:600}
#imdlg .pal{margin:0 0 10px}
#imdlg .hint{margin:6px 0 0}
#imdlg label.chk{align-items:flex-start}
#imdlg label.chk input{margin-top:3px}
#imdlg label.chk small{display:block;margin-top:2px;color:var(--mute);font-size:.78rem}
#im_n{width:96px}
.im-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#imdlg #im_q{flex:1 1 180px;width:auto;margin:0}
.im-count{margin:8px 0;color:var(--mute);font-size:.85rem}
.im-list{max-height:min(340px,38vh);overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.im-fh{display:flex;align-items:center;gap:6px;padding:3px 0;font-weight:600;font-size:.9rem}
.im-fb{margin-left:20px}
.im-fc{background:none;border:0;padding:0;width:18px;color:var(--mute)}
.im-l{display:flex;align-items:center;gap:8px;margin:0!important;padding:2px 0;color:var(--txt)!important;font-size:.86rem;cursor:pointer}
.im-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-h{max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:.76rem}
.im-b{white-space:nowrap;color:var(--mute);font-size:.74rem}
.im-m{font-weight:400;color:var(--mute);font-size:.8rem}
.im-list input[type=checkbox]{margin:0}
.btn:disabled{opacity:.5;cursor:default}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:10px 16px;border-radius:12px;background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:.9rem}
@media(max-width:600px){.im-h{display:none}}
#theme,#lang{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0}
#lang{font-size:.72rem;font-weight:500;letter-spacing:-.3px;color:var(--mute)}
#lang .lg.on{font-weight:700;color:var(--acc)}
@media(max-width:600px){#sdlg{padding:14px}#sdlg .sh{gap:6px}#sdlg .pal button{padding:4px 8px}.srow{grid-template-columns:minmax(70px,110px) 1fr 40px;gap:8px}#schart{overflow-x:auto}#schart svg{min-width:520px}}
@media(max-width:600px){#logo{height:36px}header{padding:10px 12px}#board{padding:12px;gap:20px}.cols{gap:12px}}
</style>
</head>

const idb=(m,v)=>new Promise(res=>{try{
  const r=indexedDB.open('linkboard-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('h');
  r.onerror=()=>res(null);
  r.onsuccess=()=>{const db=r.result,st=db.transaction('h',m=='get'?'readonly':'readwrite').objectStore('h');
    const q=m=='get'?st.get('file'):m=='set'?st.put(v,'file'):st.delete('file');
    q.onsuccess=()=>{res(m=='get'?(q.result||null):true);db.close()};q.onerror=()=>{res(null);db.close()}};
}catch(e){res(null)}});

const fsPayload=ts=>JSON.stringify(Object.assign({},S,{saved:ts}),null,1);
const fsParse=t=>{try{const d=JSON.parse(t);if(d&&Array.isArray(d.blocks))return d;if(d&&Array.isArray(d.cols))return{blocks:[{id:uid(),title:'',cols:d.cols}],saved:d.saved}}catch(e){}return null};
const fsFmt=t=>new Date(t).toLocaleString(LOC(),{dateStyle:'short',timeStyle:'short'});
async function fsWrite(ts){
  if(FS.mode!=='file'||!FS.handle||FS.perm!=='granted'||FS.hold)return;
  try{const w=await FS.handle.createWritable();await w.write(fsPayload(ts));await w.close();FS.last=new Date();FS.err=false}
  catch(e){FS.err=true}
  fsUI();
}
let fsT=0;
function fsQueue(ts){
  if(FS.mode!=='file')return;
  clearTimeout(fsT);
  fsT=setTimeout(()=>{FS.busy=FS.busy.then(()=>fsWrite(ts))},300);
}
async function fsPerm(ask){
  if(!FS.handle){FS.perm='none';return false}
  try{
    let p=await FS.handle.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&ask)p=await FS.handle.requestPermission({mode:'readwrite'});
    FS.perm=p;
  }catch(e){FS.perm='denied'}
  return FS.perm==='granted';
}
function adoptFile(d,ts){
  delete d.saved;S=d;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  setLocalTs(ts);FS.hold=false;FS.err=false;FS.last=new Date();render();fsUI();
}
async function fsSync(){
  if(FS.mode!=='file'||!FS.handle||FS.perm!=='granted')return;
  let t;
  try{t=await(await FS.handle.getFile()).text()}catch(e){FS.err=true;fsUI();return}
  if(!t.trim()){FS.hold=false;const ts=localTs()||Date.now();setLocalTs(ts);await fsWrite(ts);return}
  const d=fsParse(t);
  if(!d){FS.hold=true;FS.err=true;fsUI();alert(tr('fs_bad',FS.name));return}
  const ft=+d.saved||0,lt=localTs();
  const same=JSON.stringify(Object.assign({},d,{saved:0}))===JSON.stringify(Object.assign({},S,{saved:0}));
  if(same||Math.abs(ft-lt)<1500){FS.hold=false;FS.err=false;if(ft)setLocalTs(Math.max(ft,lt));FS.last=FS.last||new Date(ft||Date.now());fsUI();return}
  if(ft<lt){FS.hold=false;await fsWrite(lt);return}
  if(!lt){adoptFile(d,ft||Date.now());return}
  FS.hold=true;
  $('#cf_txt').textContent=tr('cf_txt',FS.name,ft?fsFmt(ft):'?',fsFmt(lt));
  $('#cf_file').onclick=()=>{$('#cfdlg').close();adoptFile(d,ft||Date.now())};
  $('#cf_keep').onclick=async()=>{$('#cfdlg').close();FS.hold=false;const ts=Date.now();setLocalTs(ts);await fsWrite(ts)};
  if(!$('#cfdlg').open)$('#cfdlg').showModal();
}
async function fsAttach(h){
  FS.handle=h;FS.name=h.name;FS.perm='granted';FS.err=false;FS.hold=false;
  fsSetMode('file');await idb('set',h);
}
async function fsNew(){
  if(!FS_OK)return false;
  try{
    const h=await window.showSaveFilePicker(Object.assign({suggestedName:'linkboard-daten.json'},FSP));
    await fsAttach(h);
    const ts=Date.now();setLocalTs(ts);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    await fsWrite(ts);fsUI();return true;
  }catch(e){return false}
}
async function fsOpen(){
  if(!FS_OK)return false;
  try{
    const[h]=await window.showOpenFilePicker(Object.assign({multiple:false},FSP));
    const t=await(await h.getFile()).text();
    const d=t.trim()?fsParse(t):null;
    if(t.trim()&&!d){alert(tr('fs_bad',h.name));return false}
    if(d&&hasUserData()&&!confirm(tr('fs_replace',h.name)))return false;
    await fsAttach(h);
    if(d)adoptFile(d,+d.saved||Date.now());
    else{const ts=Date.now();setLocalTs(ts);await fsWrite(ts)}
    fsUI();return true;
  }catch(e){return false}
}
async function fsStop(){
  clearTimeout(fsT);FS.handle=null;FS.perm='none';FS.err=false;FS.hold=false;

/* Link-Arten: alles ausser Skript-Adressen ist erlaubt */
const BAD_SCHEME=/^\s*(javascript|data|vbscript|blob):/i;
const KNOWN_SC=/^(mailto|tel|sms|file):/i;
function normUrl(u){
  u=u.trim();
  if(KNOWN_SC.test(u)||/^[a-z][a-z0-9+.-]*:\/\//i.test(u))return u;
  const local=/^(localhost|\d{1,3}(\.\d{1,3}){3}|[^\/:]*\.local)(:\d+)?([\/?#]|$)/i.test(u);
  const hostPort=/^[^\/:?#@]+:\d+([\/?#]|$)/.test(u);
  if(!local&&!hostPort&&/^[a-z][a-z0-9+.-]*:/i.test(u))return u;
  return (local?'http://':'https://')+u;
}
function tileHTML(t,ro){
  let host='';try{const u=new URL(t.url);if(/^https?:$/.test(u.protocol))host=u.hostname}catch(e){}
  const href=BAD_SCHEME.test(t.url)?'#':t.url;
  return `<div class="tile${t.sq?' sq':''}" data-id="${t.id}" style="background:${t.color};color:${fg(t.color)}"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${tr('n_clicks',t.clicks||0)}" data-clk="${t.clicks||0}">${host?`<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" onerror="this.style.display='none'">`:''}<span>${esc(t.name)}</span></a>${chkDot(t)}${ro?'':`<button class="ib ed" data-act="edit" data-id="${t.id}" title="${tr('edit')}">✎</button>`}</div>`;
}
function colHTML(c){

    return `<section class="col smart" data-id="${c.id}"><div class="ch"><span class="grip cg" title="${tr('mv_col')}">⠿</span><input class="ct" data-id="${c.id}" value="${esc(c.title)}" placeholder="${tr('ph_title')}" ${edit?'':'readonly tabindex="-1"'}>${openBtn(c,top)}<select class="ed nsel" data-id="${c.id}" title="${tr('cnt_t')}"><option value="5" ${c.n==10?'':'selected'}>Top 5</option><option value="10" ${c.n==10?'selected':''}>Top 10</option></select><button class="ib ed" data-act="delcol" data-id="${c.id}" title="${tr('del_tile')}">✕</button></div><div class="tiles smart">${top.length?top.map(t=>tileHTML(t,1)).join(''):'<div class="hint">'+tr('hint_top')+'</div>'}</div></section>`;

const SO=()=>({animation:150,disabled:!edit,delay:150,delayOnTouchOnly:true,ghostClass:'sortable-ghost',onEnd:sync});

const blkSort=new Sortable(board,{animation:150,handle:'.bg',draggable:'.blk',disabled:true,delay:150,delayOnTouchOnly:true,ghostClass:'sortable-ghost',onEnd:sync});
function sync(){
  const all={},cm={},bm={};
  S.blocks.forEach(b=>{bm[b.id]=b;b.cols.forEach(c=>{cm[c.id]=c;c.tiles.forEach(t=>all[t.id]=t)})});
  S.blocks=[...board.querySelectorAll('.blk')].map(be=>{
    const b=bm[be.dataset.id];
    b.cols=[...be.querySelectorAll('.col')].map(ce=>{const c=cm[ce.dataset.id];if(!c.smart)c.tiles=[...ce.querySelectorAll('.tile')].map(t=>all[t.dataset.id]);return c});
    return b;
  });
  save();
}
function filter(){
  const ql=q.trim().toLowerCase(),on=!!(ql||fc);
  board.querySelectorAll('.col').forEach(col=>{
    let n=0;
    col.querySelectorAll('.tile').forEach(el=>{
      const[,t]=findTile(el.dataset.id);
      const ok=(!ql||(t.name+' '+t.url).toLowerCase().includes(ql))&&(!fc||t.color===fc);
      el.hidden=!ok;if(ok)n++;
    });
    col.hidden=on&&!n&&!edit;
  });
  board.querySelectorAll('.blk').forEach(b=>{b.hidden=on&&!edit&&![...b.querySelectorAll('.col')].some(c=>!c.hidden)});
}

const IM_OK={test:u=>/^[a-z][a-z0-9+.-]*:/i.test(u)&&!/^(javascript|data|vbscript|blob|file|about|chrome|chrome-extension|edge|brave|vivaldi|opera|view-source|place|moz-extension|resource|safari-extension|reader|x-apple-reader):/i.test(u)}

function parseBookmarks(txt){
  const items=[],stack=[];let pend=null;
  const dec=s=>{const t=document.createElement('textarea');t.innerHTML=String(s).replace(/<[^>]*>/g,'');return t.value.trim()};
  const re=/<dl\b[^>]*>|<\/dl>|<h3\b[^>]*>([\s\S]*?)<\/h3>|<a\b([^>]*)>([\s\S]*?)<\/a>/gi;
  let m;
  while((m=re.exec(txt))){
    const t=m[0].slice(0,4).toLowerCase();
    if(t.startsWith('<dl')){stack.push(pend);pend=null}
    else if(t=='</dl')stack.pop();
    else if(m[1]!==undefined)pend=dec(m[1]);
    else if(m[2]!==undefined){
      const h=/href\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(m[2]);
      if(!h)continue;
      const url=dec(h[1]!==undefined?h[1]:h[2]!==undefined?h[2]:h[3]);
      if(url)items.push({title:dec(m[3]),url,path:stack.filter(x=>x)});
    }
  }
  return items;
}

function openImport(txt,name){
  const items=parseBookmarks(txt);
  if(!items.length){alert(tr('im_none_found'));return}
  const have=new Set(allCols().flatMap(c=>c.tiles).map(t=>imNorm(t.url))),seen=new Set();
  items.forEach(x=>{
    const k=imNorm(x.url),sc=(/^([a-z][a-z0-9+.-]*):/i.exec(x.url)||[])[1];
    x.bad=IM_OK.test(x.url)?'':(sc?sc+'://':tr('bad_noaddr'));
    x.dup=have.has(k)?tr('im_dup'):seen.has(k)?tr('im_dupf'):'';
    seen.add(k);x.sel=!x.bad&&!x.dup;
  });
  IM.items=items;IM.mode='folders';IM.cm='alt';IM.pal=pal;IM.one=null;IM.chk=false;IM.folders=[];
  const root={kids:[]};
  items.forEach((x,i)=>{
    let node=root;
    x.path.forEach(nm=>{
      let c=node.kids.find(k=>k.folder&&k.name===nm);
      if(!c){c={folder:true,name:nm,kids:[],idx:[],id:IM.folders.length};IM.folders.push(c);node.kids.push(c)}
      node=c;c.idx.push(i);
    });
    node.kids.push({item:i});
  });
  $('#im_list').innerHTML=imRows(root);
  const nd=items.filter(x=>x.dup).length,nb=items.filter(x=>x.bad).length;
  $('#imsum').textContent=tr('im_sum',items.length,IM.folders.length,name,nd,nb);
  segSet('im_mode',IM.mode);imColorUI();
  $('#im_n').value=20;$('#im_chk').checked=false;$('#im_q').value='';
  imSync();
  $('#imdlg').showModal();
}

async function chime(){
  const a=audio();if(!a)return false;
  try{await a.resume()}catch(e){}
  if(a.state!=='running')return false;
  const t=a.currentTime;
  [[659.25,0],[880,.28]].forEach(([f,d])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+d);
    g.gain.exponentialRampToValueAtTime(.18,t+d+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+d+.9);
    o.connect(g);g.connect(a.destination);
    o.start(t+d);o.stop(t+d+1);
  });
  return true;
}

  testUntil=Date.now()+8000;wasBrk=true;tick();
  if(SET.snd)chime().then(ok=>{$('#s_note').textContent=ok?SNDNOTE():tr('snd_fail')});

/* Link-Check (grün/rot) */
const CHK=KEY+'-chk',TTL=15*60*1000,PRIV=/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)|\.local$/i;
let cache={},inflight=new Set(),queue=[],running=0;
try{cache=JSON.parse(localStorage.getItem(CHK))||{}}catch(e){}
const saveCache=()=>{try{localStorage.setItem(CHK,JSON.stringify(cache))}catch(e){}};
function chkKind(t){
  if(!SET.chk||t.chk===false)return 'none';
  let u;try{u=new URL(t.url)}catch(e){return 'none'}
  if(u.protocol!=='http:'&&u.protocol!=='https:')return 'none';
  if(location.protocol==='https:'&&(u.protocol==='http:'||PRIV.test(u.hostname)))return 'na';
  return 'chk';
}
function chkDot(t){const k=chkKind(t);return k=='none'?'':`<i class="st" data-u="${esc(t.url)}" data-k="${k}"></i>`}
function paint(el){
  const c=cache[el.dataset.u];
  let s='p',tip=tr('ck_wait');
  if(el.dataset.k=='na'){s='n';tip=tr('ck_na')}
  else if(c){
    const tm=new Date(c.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    s=c.ok?'ok':'bad';tip=tr('ck_at',c.ok?tr('ck_ok'):tr('ck_bad'),tm);
  }else if(!navigator.onLine){s='n';tip=tr('ck_off')}
  el.className='st '+s;
  const a=el.parentNode.querySelector('a');
  if(a)a.title=tr('n_clicks',a.dataset.clk||0)+' · '+tip;
}
const paintAll=()=>document.querySelectorAll('.st').forEach(paint);
async function req(url,method){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
  try{await fetch(url,{method,mode:'no-cors',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:ac.signal});return 'ok'}
  catch(e){return e&&e.name==='AbortError'?'timeout':'fail'}
  finally{clearTimeout(to);ac.abort()}
}
async function ping(url){
  let r=await req(url,'HEAD');
  if(r==='fail')r=await req(url,'GET');
  return r==='ok';
}
function pump(){
  while(running<3&&queue.length){
    const u=queue.shift();running++;
    ping(u).then(ok=>{
      cache[u]={ok,ts:Date.now()};saveCache();inflight.delete(u);running--;
      document.querySelectorAll('.st').forEach(el=>{if(el.dataset.u===u)paint(el)});
      pump();
    });
  }
}
function checkAll(){
  if(!navigator.onLine)return;
  const now=Date.now();
  for(const k in cache)if(now-cache[k].ts>7*864e5)delete cache[k];
  const urls=new Set();
  document.querySelectorAll('.st[data-k="chk"]').forEach(el=>{
    const u=el.dataset.u,c=cache[u];
    if(!inflight.has(u)&&(!c||now-c.ts>=TTL))urls.add(u);
  });
  urls.forEach(u=>{inflight.add(u);queue.push(u)});
  pump();
}
addEventListener('online',()=>{paintAll();checkAll()});
addEventListener('offline',paintAll);
setInterval(checkAll,5*60*1000);

/* Statistik */
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dm=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
let sper='day',ssel='';
function buckets(per){
  const now=new Date();now.setHours(12,0,0,0);
  const out=[];
  if(per=='day')for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);out.push({from:dk(d),to:dk(d),label:dm(d),tip:d.toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'})})}
  if(per=='week'){const mon=new Date(now);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    for(let i=11;i>=0;i--){const a=new Date(mon);a.setDate(a.getDate()-7*i);const b=new Date(a);b.setDate(b.getDate()+6);out.push({from:dk(a),to:dk(b),label:dm(a),tip:tr('wk_from',a.toLocaleDateString(LOC(),{day:'numeric',month:'short'}))})}}
  if(per=='month')for(let i=11;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1,12),b=new Date(a.getFullYear(),a.getMonth()+1,0,12);out.push({from:dk(a),to:dk(b),label:a.toLocaleDateString(LOC(),{month:'short'}),tip:a.toLocaleDateString(LOC(),{month:'long',year:'numeric'})})}
  return out;
}
const sumDays=(t,from,to)=>{let s=0;const d=t.days||{};for(const k in d)if(k>=from&&k<=to)s+=d[k];return s};
function chart(bs,vals){
  const W=720,H=230,L=34,R=8,T=16,B=28,pw=W-L-R,ph=H-T-B,n=bs.length;
  const top=Math.max(4,Math.ceil(Math.max(...vals)/4)*4),bw=pw/n,bx=bw*.62;
  let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line class="sg" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="sy" x="${L-6}" y="${y+4}" text-anchor="end">${top*i/4}</text>`}
  bs.forEach((b,i)=>{
    const v=vals[i],h=v/top*ph,x=L+i*bw+(bw-bx)/2,y=T+ph-h;
    g+=`<rect class="sb" x="${x}" y="${y}" width="${bx}" height="${Math.max(h,0)}" rx="3"><title>${esc(b.tip)}: ${tr('n_clicks',v)}</title></rect>`;
    if(v>0)g+=`<text class="sv" x="${x+bx/2}" y="${y-4}" text-anchor="middle">${v}</text>`;
    g+=`<text class="sx" x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  $('#schart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('st_aria')}" style="width:100%;height:auto;display:block">${g}</svg>`;
}
function renderStats(){
  $('#sper').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p==sper));
  const bs=buckets(sper),from=bs[0].from,to=bs[bs.length-1].to;
  const tiles=allCols().flatMap(c=>c.tiles);
  if(ssel&&!tiles.some(t=>t.id==ssel))ssel='';
  const rows=tiles.map(t=>({t,n:sumDays(t,from,to)})).filter(r=>r.n>0).sort((a,b)=>b.n-a.n).slice(0,10),mx=rows.length?rows[0].n:1;
  $('#stop').innerHTML=rows.length?rows.map(r=>`<button class="srow${ssel==r.t.id?' on':''}" data-id="${r.t.id}" title="${esc(r.t.url)}"><span class="sn">${esc(r.t.name)}</span><span class="sbw"><i style="width:${Math.max(3,r.n/mx*100)}%;background:${r.t.color}"></i></span><b>${r.n}</b></button>`).join(''):'<div class="hint">'+tr('st_none')+'</div>';
  $('#slink').innerHTML='<option value="">'+tr('st_all')+'</option>'+[...tiles].sort((a,b)=>a.name.localeCompare(b.name,LANG)).map(t=>`<option value="${t.id}"${ssel==t.id?' selected':''}>${esc(t.name)}</option>`).join('');
  const sel=tiles.find(t=>t.id==ssel);
  chart(bs,bs.map(b=>sel?sumDays(sel,b.from,b.to):tiles.reduce((s,t)=>s+sumDays(t,b.from,b.to),0)));
  let first='',tot=0,dayTot=0;
  tiles.forEach(t=>{tot+=t.clicks||0;for(const k in t.days||{}){dayTot+=t.days[k];if(!first||k<first)first=k}});
  let note=first?tr('st_note_a',new Date(first+'T12:00').toLocaleDateString(LOC()),tot)+(tot>dayTot?tr('st_note_b',tot-dayTot):'')+'.':
    tot?tr('st_note_c',tot):tr('st_note_d');
  $('#snote').textContent=note+tr('st_note_e');
}
$('#stat').onclick=()=>{renderStats();$('#sdlg').showModal()};
$('#sclose').onclick=()=>$('#sdlg').close();
$('#sdlg').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()});
$('#sper').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sper=b.dataset.p;renderStats()});
$('#stop').addEventListener('click',e=>{const b=e.target.closest('.srow');if(!b)return;ssel=ssel==b.dataset.id?'':b.dataset.id;renderStats()});
$('#slink').addEventListener('change',e=>{ssel=e.target.value;renderStats()});

/* Uhr + Kaffeepause */
const p2=n=>String(n).padStart(2,'0');
let testUntil=0,wasBrk=false;
function tick(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),hm=p2(h)+':'+p2(m);
  const brk=SET.brk&&(hm===SET.b1||hm===SET.b2||Date.now()<testUntil);
  $('#cup').toggleAttribute('hidden',!brk);
  $('#tm').toggleAttribute('hidden',brk);
  if(!brk)$('#tm').innerHTML=SET.h12?((h%12)||12)+':'+p2(m)+'<span class="ap">'+(h<12?'AM':'PM')+'</span>':hm;
  if(brk&&!wasBrk&&SET.snd)chime();
  wasBrk=brk;
  $('#clk').title=brk?tr('coffee'):tr('clk_t');
}
tick();setInterval(tick,1000);

load();applyLang();weather();setInterval(weather,15*60*1000);
fsInit();
