<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startseite</title>
<style>
:root{--bg:#181818;--panel:#30302e;--line:#454542;--txt:#efede6;--mute:#a09e96;--acc:#7fb3d5;--hov:#3b3b38;--th:52px;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f3ee;--panel:#ffffff;--line:#dad8cf;--txt:#1f1e1d;--mute:#6b6962;--acc:#4a90c2;--hov:#ebe9e2;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
#q{flex:1 1 110px;max-width:460px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);outline:none}
#q:focus,.ct:focus{border-color:var(--acc)}
#dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.dot.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--bg) inset}
.sp{flex:1}
.btn{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10202c;font-weight:600}
#wx{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
#wx:hover{background:var(--panel)}
#wx b{font-size:1.25rem;font-weight:600}
#wx small{color:var(--mute);display:block;line-height:1.1}
#board{display:flex;flex-direction:column;gap:28px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;align-items:start;min-height:24px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bt{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:600;font-size:1.2rem;outline:none}
body.edit .bt{border-color:var(--line)}
.bt:focus{border-color:var(--acc)}
.sel,.nsel{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:3px 2px;font-size:.78rem;width:80px;flex:none}
.hint{grid-column:1/-1;color:var(--mute);font-size:.85rem;padding:4px 2px}
.tile.sq{grid-column:auto;height:calc(var(--th)*2 + 8px)}
.tile.sq a{flex-direction:column;justify-content:center;align-self:stretch;text-align:center;gap:8px;padding:10px 8px}
.tile.sq img{width:32px;height:32px;border-radius:8px}
.tile.sq span{white-space:normal;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile.sq .ib{position:absolute;top:3px;right:1px;margin:0}
body.edit .tiles.smart .tile{cursor:auto}
.col{background:var(--panel);border-radius:14px;padding:12px}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ct{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:600;font-size:1rem;outline:none}
body.edit .ct{border-color:var(--line)}
.grip{display:none;cursor:grab;color:var(--mute);padding:0 4px;font-size:1.2rem}
.ib{background:none;border:0;padding:4px 7px;border-radius:7px;color:var(--mute)}
.ib:hover{background:var(--hov);color:var(--txt)}
.ed{display:none}
body.edit .ed,body.edit .grip{display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:14px}
.tile{display:flex;align-items:center;border-radius:10px;overflow:hidden;position:relative;grid-column:1/-1;height:var(--th)}
body.edit .tile{cursor:grab}
.tile a{flex:1;display:flex;align-items:center;gap:10px;padding:11px 13px;color:inherit;text-decoration:none;font-weight:500;min-width:0}
.tile a:hover{filter:brightness(1.12)}
body.edit .tile a{pointer-events:none}
.tile img{width:18px;height:18px;border-radius:4px;flex:none}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ib{color:inherit;opacity:.8;margin-right:4px}
.add{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--mute)}
.add:hover{border-color:var(--acc);color:var(--txt)}
.sortable-ghost{opacity:.35}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 14px}
dialog label{display:block;margin-bottom:12px;color:var(--mute);font-size:.85rem}
dialog input:not([type=color]){display:block;width:100%;margin-top:4px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);outline:none}
dialog input:focus{border-color:var(--acc)}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.pal button{padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:none;font-size:.78rem;color:var(--mute)}
.pal button.on{background:var(--acc);border-color:var(--acc);color:#10202c;font-weight:600}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--txt)}
.sw input[type=color]{width:32px;height:28px;padding:0;border:0;background:none}
.row{display:flex;gap:8px;margin-top:16px}
#clk{display:flex;align-items:center;justify-content:center;min-width:92px;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:1.25rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
#clk:hover{background:var(--panel)}
.ap{font-size:.7rem;font-weight:500;color:var(--mute);margin-left:4px}
#cup{color:var(--mute)}
#cup .cb,#cup .ch2,#cup .sa{fill:var(--acc);stroke:none}
#cup .ch2{fill:none;stroke:var(--acc)}
#cup .sa{fill:none;stroke:var(--acc)}
#cup .steam{stroke:var(--mute)}
#cup .steam path{opacity:0;animation:steam 2.4s ease-in-out infinite}
#cup .steam .s2{animation-delay:.8s}
#cup .steam .s3{animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
dialog select{display:block;width:100%;margin-top:4px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}
#ft{padding:8px 20px 22px;text-align:center;font-size:.75rem;color:var(--mute)}
#ft a{color:inherit;text-decoration:none;opacity:.7}
#ft a:hover{opacity:1;text-decoration:underline}
#logo{height:50px;width:auto;flex:none;filter:invert(1);opacity:.92}
:root[data-theme=light] #logo{filter:none;opacity:.9}
@media(max-width:600px){#logo{height:36px}header{padding:10px 12px}#board{padding:12px;gap:20px}.cols{gap:12px}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const KEY='startseite-v1', PALS=[
 {n:'1 · Pastell',c:['#7fb3d5','#8fbf8f','#e0b252','#d98a6c','#c58fc9','#d9728f','#8d8d88','#3f3f3c']},
 {n:'2 · Kräftig',c:['#1e88e5','#43a047','#fb8c00','#e53935','#8e24aa','#d81b60','#00acc1','#546e7a']},
 {n:'3 · Erdtöne',c:['#8c6e54','#6b7f5e','#b0894f','#a65e46','#7a6a8a','#9c5a6c','#5f7a80','#4a4540']}
];
let pal=0;try{pal=Math.min(PALS.length-1,+localStorage.getItem(KEY+'-pal')||0)}catch(e){}
let COLORS=PALS[pal].c;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fg=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))>150?'#1f1e1d':'#fff'};
const hue=h=>{const n=parseInt(h.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);if(d<.08)return 999;const x=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;return(x*60+360)%360};
let S,edit=false,q='',fc=null,cur=null,color=COLORS[0];
const board=$('#board');

const allCols=()=>S.blocks.flatMap(b=>b.cols);
const colById=id=>allCols().find(c=>c.id==id);
const newCol=t=>({id:uid(),title:t,tiles:[]});
const SORTS={az:(a,b)=>a.name.localeCompare(b.name,'de',{sensitivity:'base'}),color:(a,b)=>hue(a.color)-hue(b.color),clicks:(a,b)=>(b.clicks||0)-(a.clicks||0)};
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(S&&S.cols&&!S.blocks)S={blocks:[{id:uid(),title:'',cols:S.cols}]};
  if(!S||!S.blocks){
    const T=(name,url,color,sq)=>({id:uid(),name,url,color,sq:!!sq});
    S={blocks:[
      {id:uid(),title:'Favoriten',cols:[
        {id:uid(),title:'Allgemein',tiles:[T('Wikipedia','https://www.wikipedia.org','#7fb3d5'),T('YouTube','https://www.youtube.com','#d9728f',1),T('Reddit','https://www.reddit.com','#d98a6c',1),T('OpenStreetMap','https://www.openstreetmap.org','#8fbf8f')]},
        {id:uid(),title:'Nachrichten',tiles:[T('BBC News','https://www.bbc.com/news','#d9728f'),T('Reuters','https://www.reuters.com','#8d8d88'),T('The Guardian','https://www.theguardian.com','#7fb3d5')]},
        {id:uid(),title:'Entwicklung',tiles:[T('GitHub','https://github.com','#3f3f3c',1),T('Stack Overflow','https://stackoverflow.com','#e0b252',1),T('MDN Web Docs','https://developer.mozilla.org','#7fb3d5'),T('Hacker News','https://news.ycombinator.com','#d98a6c')]}
      ]},
      {id:uid(),title:'Freizeit',cols:[{id:uid(),title:'Musik',tiles:[]},{id:uid(),title:'Filme & Serien',tiles:[]},{id:uid(),title:'Lesen',tiles:[]}]}
    ]};
  }
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const findTile=id=>{for(const c of allCols()){const t=c.tiles.find(t=>t.id==id);if(t)return[c,t]}return[]};
const count=a=>{const[,t]=findTile(a.closest('.tile').dataset.id);if(t){t.clicks=(t.clicks||0)+1;save()}};

function tileHTML(t,ro){
  let host='';try{host=new URL(t.url).hostname}catch(e){}
  return `<div class="tile${t.sq?' sq':''}" data-id="${t.id}" style="background:${t.color};color:${fg(t.color)}"><a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" title="${t.clicks||0} Klicks"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" onerror="this.style.display='none'"><span>${esc(t.name)}</span></a>${ro?'':`<button class="ib ed" data-act="edit" data-id="${t.id}" title="Bearbeiten">✎</button>`}</div>`;
}
function colHTML(c){
  if(c.smart){
    const top=allCols().flatMap(x=>x.tiles).filter(t=>t.clicks>0).sort(SORTS.clicks).slice(0,c.n==10?10:5);
    return `<section class="col smart" data-id="${c.id}"><div class="ch"><span class="grip cg" title="Spalte verschieben">⠿</span><input class="ct" data-id="${c.id}" value="${esc(c.title)}" placeholder="Titel" ${edit?'':'readonly tabindex="-1"'}><select class="ed nsel" data-id="${c.id}" title="Anzahl"><option value="5" ${c.n==10?'':'selected'}>Top 5</option><option value="10" ${c.n==10?'selected':''}>Top 10</option></select><button class="ib ed" data-act="delcol" data-id="${c.id}" title="Kachel löschen">✕</button></div><div class="tiles smart">${top.length?top.map(t=>tileHTML(t,1)).join(''):'<div class="hint">Noch keine Klicks. Hier erscheinen deine meistgeklickten Links.</div>'}</div></section>`;
  }
  return `<section class="col" data-id="${c.id}"><div class="ch"><span class="grip cg" title="Spalte verschieben">⠿</span><input class="ct" data-id="${c.id}" value="${esc(c.title)}" placeholder="Titel" ${edit?'':'readonly tabindex="-1"'}><select class="ed sel" data-id="${c.id}" title="Spalte sortieren"><option value="">Sortieren</option><option value="az">A–Z</option><option value="color">Farbe</option><option value="clicks">Meiste Klicks</option></select><button class="ib ed" data-act="delcol" data-id="${c.id}" title="Spalte löschen">✕</button></div><div class="tiles">${c.tiles.map(t=>tileHTML(t)).join('')}</div><button class="add ed" data-act="add" data-id="${c.id}">+ Link</button></section>`;
}
const SO=()=>({animation:150,disabled:!edit,delay:150,delayOnTouchOnly:true,ghostClass:'sortable-ghost',onEnd:sync});
function render(){
  document.body.classList.toggle('edit',edit);
  $('#mode').textContent=edit?'Fertig':'Bearbeiten';
  $('#mode').classList.toggle('pri',edit);
  board.innerHTML=S.blocks.map(b=>`<section class="blk" data-id="${b.id}"><div class="bh" ${!edit&&!b.title?'hidden':''}><span class="grip bg" title="Block verschieben">⠿</span><input class="bt" data-id="${b.id}" value="${esc(b.title)}" placeholder="Blocktitel" ${edit?'':'readonly tabindex="-1"'}><button class="btn ed" data-act="addcol" data-id="${b.id}">+ Spalte</button><button class="ib ed" data-act="delblk" data-id="${b.id}" title="Block löschen">✕</button></div><div class="cols">${b.cols.map(colHTML).join('')}</div></section>`).join('');
  board.querySelectorAll('.cols').forEach(el=>new Sortable(el,Object.assign(SO(),{group:'cols',handle:'.cg',draggable:'.col'})));
  board.querySelectorAll('.tiles:not(.smart)').forEach(el=>new Sortable(el,Object.assign(SO(),{group:'tiles'})));
  const used=[...new Set(allCols().flatMap(c=>c.tiles.map(t=>t.color)))];
  $('#dots').innerHTML=used.map(c=>`<button class="dot${fc==c?' on':''}" data-c="${c}" style="background:${c}" aria-label="Farbe ${c}"></button>`).join('');
  filter();
}
const blkSort=new Sortable(board,{animation:150,handle:'.bg',draggable:'.blk',disabled:true,delay:150,delayOnTouchOnly:true,ghostClass:'sortable-ghost',onEnd:sync});
function sync(){
  const all={},cm={},bm={};
  S.blocks.forEach(b=>{bm[b.id]=b;b.cols.forEach(c=>{cm[c.id]=c;c.tiles.forEach(t=>all[t.id]=t)})});
  S.blocks=[...board.querySelectorAll('.blk')].map(be=>{
    const b=bm[be.dataset.id];
    b.cols=[...be.querySelectorAll('.col')].map(ce=>{const c=cm[ce.dataset.id];if(!c.smart)c.tiles=[...ce.querySelectorAll('.tile')].map(t=>all[t.dataset.id]);return c});
    return b;
  });
  save();
}
function filter(){
  const ql=q.trim().toLowerCase(),on=!!(ql||fc);
  board.querySelectorAll('.col').forEach(col=>{
    let n=0;
    col.querySelectorAll('.tile').forEach(el=>{
      const[,t]=findTile(el.dataset.id);
      const ok=(!ql||(t.name+' '+t.url).toLowerCase().includes(ql))&&(!fc||t.color===fc);
      el.hidden=!ok;if(ok)n++;
    });
    col.hidden=on&&!n&&!edit;
  });
  board.querySelectorAll('.blk').forEach(b=>{b.hidden=on&&!edit&&![...b.querySelectorAll('.col')].some(c=>!c.hidden)});
}

/* Klicks im Board */
board.addEventListener('click',e=>{
  const a=e.target.closest('.tile a');if(a&&!edit)count(a);
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id,act=b.dataset.act;
  if(act=='add')openDlg(id,null);
  if(act=='edit'){const[c,t]=findTile(id);openDlg(c.id,t)}
  if(act=='addcol'){S.blocks.find(x=>x.id==id).cols.push(newCol('Neue Spalte'));save();render()}
  if(act=='delcol'){const c=colById(id);if(!c.tiles.length||confirm(`Spalte „${c.title||'ohne Titel'}“ mit ${c.tiles.length} Links löschen?`)){S.blocks.forEach(x=>x.cols=x.cols.filter(y=>y!=c));save();render()}}
  if(act=='delblk'){const bl=S.blocks.find(x=>x.id==id),n=bl.cols.reduce((s,c)=>s+c.tiles.length,0);if(!n||confirm(`Block „${bl.title||'ohne Titel'}“ mit ${n} Links löschen?`)){S.blocks=S.blocks.filter(x=>x!=bl);save();render()}}
});
board.addEventListener('auxclick',e=>{const a=e.target.closest('.tile a');if(a&&!edit&&e.button==1)count(a)});
board.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('ct')){colById(t.dataset.id).title=t.value.trim();save()}
  if(t.classList.contains('bt')){S.blocks.find(x=>x.id==t.dataset.id).title=t.value.trim();save()}
  if(t.classList.contains('nsel')){colById(t.dataset.id).n=+t.value;save();render()}
  if(t.classList.contains('sel')&&t.value){colById(t.dataset.id).tiles.sort(SORTS[t.value]);save();render()}
});
$('#dots').addEventListener('click',e=>{const b=e.target.closest('.dot');if(!b)return;fc=fc==b.dataset.c?null:b.dataset.c;render()});
$('#q').addEventListener('input',e=>{q=e.target.value;filter()});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'&&q.trim()){const a=board.querySelector('.tile:not([hidden]) a');if(a){count(a);window.open(a.href,'_blank','noopener')}}});
$('#mode').onclick=()=>{edit=!edit;blkSort.option('disabled',!edit);render()};
$('#addblk').onclick=()=>{S.blocks.push({id:uid(),title:'Neuer Block',cols:[newCol('Neue Spalte')]});save();render();const t=[...board.querySelectorAll('.bt')].pop();t.focus();t.select();t.scrollIntoView({block:'center'})};

$('#addcol').onclick=()=>{
  if(!S.blocks.length)S.blocks.push({id:uid(),title:'',cols:[]});
  S.blocks[S.blocks.length-1].cols.push(newCol('Neue Spalte'));save();render();
  const t=[...board.querySelectorAll('.ct')].pop();t.focus();t.select();t.scrollIntoView({block:'center'});
};
$('#addsmart').onclick=()=>{
  if(!S.blocks.length)S.blocks.push({id:uid(),title:'',cols:[]});
  S.blocks[0].cols.unshift({id:uid(),title:'Meistgeklickt',smart:true,n:5,tiles:[]});save();render();scrollTo({top:0,behavior:'smooth'});
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!edit){load();render()}});

/* Dialog */
function swatches(){
  $('#pal').innerHTML=PALS.map((p,i)=>`<button data-p="${i}" class="${i==pal?'on':''}">${p.n}</button>`).join('');
  $('#sw').innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c==color?'on':''}" style="background:${c}" aria-label="${c}"></button>`).join('')+`<input type="color" id="fc" value="${color}" title="Eigene Farbe">`;
  $('#fc').oninput=e=>{color=e.target.value;$('#sw').querySelectorAll('button').forEach(b=>b.classList.remove('on'))};
}
$('#pal').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=COLORS.indexOf(color);
  pal=+b.dataset.p;COLORS=PALS[pal].c;
  if(i>=0)color=COLORS[i];
  try{localStorage.setItem(KEY+'-pal',pal)}catch(e){}
  swatches();
});
$('#sw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;color=b.dataset.c;swatches()});
let sq=false;
const shapeUI=()=>$('#shape').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.q=='1')==sq));
$('#shape').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sq=b.dataset.q=='1';shapeUI()});
function openDlg(colId,t){
  cur={colId,t};sq=!!(t&&t.sq);shapeUI();
  $('#dt').textContent=t?'Link bearbeiten':'Neuer Link';
  $('#fn').value=t?t.name:'';$('#fu').value=t?t.url:'';
  color=t?t.color:COLORS[0];if(t){const k=PALS.findIndex(p=>p.c.includes(color));if(k>=0){pal=k;COLORS=PALS[k].c}}swatches();
  $('#del').hidden=!t;
  $('#dlg').showModal();$('#fn').focus();
}
$('#cancel').onclick=()=>$('#dlg').close();
$('#del').onclick=()=>{const c=colById(cur.colId);c.tiles=c.tiles.filter(x=>x!=cur.t);save();$('#dlg').close();render()};
$('#ok').onclick=()=>{
  let url=$('#fu').value.trim();if(!url){$('#fu').focus();return}
  if(!/^([a-z][a-z0-9+.-]*:\/\/|mailto:|tel:|sms:|file:)/i.test(url))url=(/^(localhost|\d{1,3}(\.\d{1,3}){3}|[^\/:]*\.local)(:\d+)?([\/?#]|$)/i.test(url)?'http://':'https://')+url;
  let name=$('#fn').value.trim();
  if(!name){try{name=new URL(url).hostname.replace(/^www\./,'')||url}catch(e){name=url}}
  if(cur.t){Object.assign(cur.t,{name,url,color,sq})}
  else colById(cur.colId).tiles.push({id:uid(),name,url,color,sq});
  save();$('#dlg').close();render();
};
$('#dlg').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&e.target.type!='color')$('#ok').click()});

/* Export / Import */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='startseite.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text());if(d.blocks)S=d;else if(d.cols)S={blocks:[{id:uid(),title:"",cols:d.cols}]};else throw 0;save();render()}catch(x){alert('Datei konnte nicht gelesen werden.')}
  e.target.value='';
};

/* Wetter (Open-Meteo, ohne Schlüssel) */
const ico=c=>c==0?'☀️':c<=2?'⛅':c==3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌧️':c<=86?'❄️':'⛈️';
const WMO={0:'Klar',1:'Meist klar',2:'Teils bewölkt',3:'Bedeckt',45:'Nebel',48:'Nebel',51:'Nieselregen',53:'Nieselregen',55:'Nieselregen',61:'Regen',63:'Regen',65:'Starker Regen',71:'Schnee',73:'Schnee',75:'Starker Schnee',80:'Schauer',81:'Schauer',82:'Starke Schauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'};
const DEF={lat:46.95,lon:7.45,name:'Bern'};
function getLoc(){let l;try{l=JSON.parse(localStorage.getItem(KEY+'-loc'))}catch(e){}return l||DEF}
async function weather(){
  try{
    const l=getLoc(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&current=temperature_2m,weather_code&timezone=auto`,{signal:ac.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const c=(await r.json()).current;
    $('#wi').textContent=ico(c.weather_code);
    $('#wt').textContent=Math.round(c.temperature_2m)+' °C';
    $('#wp').textContent=(l.name||'')+(WMO[c.weather_code]?' · '+WMO[c.weather_code]:'');
    $('#wx').title='Klicken, um den Ort zu ändern';
  }catch(e){
    const m=String(e&&e.message||e);
    $('#wi').textContent='⚠️';$('#wt').textContent='–';
    $('#wp').textContent='Fehler: '+m.slice(0,40);
    $('#wx').title='Wetter nicht verfügbar ('+m+'). Klicken, um den Ort zu ändern.';
  }
}
$('#wx').onclick=async()=>{
  const n=prompt('Ort für das Wetter (z. B. Bern):');if(!n)return;
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(n)}&count=1&language=de`);
    const g=(await r.json()).results[0];
    localStorage.setItem(KEY+'-loc',JSON.stringify({lat:g.latitude,lon:g.longitude,name:g.name}));weather();
  }catch(e){alert('Ort nicht gefunden.')}
};

const setTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t=='light'?'🌙':'☀️';try{localStorage.setItem(KEY+'-theme',t)}catch(e){}};
let th='dark';try{th=localStorage.getItem(KEY+'-theme')||'dark'}catch(e){}
setTheme(th);
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme=='light'?'dark':'light');

/* Uhr + Kaffeepause */
const CK=KEY+'-clock',p2=n=>String(n).padStart(2,'0');
let CS={h12:false,b1:'09:30',b2:'15:00'},testUntil=0;
try{Object.assign(CS,JSON.parse(localStorage.getItem(CK))||{})}catch(e){}
function tick(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),hm=p2(h)+':'+p2(m);
  const brk=hm===CS.b1||hm===CS.b2||Date.now()<testUntil;
  $('#cup').toggleAttribute('hidden',!brk);
  $('#tm').toggleAttribute('hidden',brk);
  if(!brk){
    $('#tm').innerHTML=CS.h12?((h%12)||12)+':'+p2(m)+'<span class="ap">'+(h<12?'AM':'PM')+'</span>':hm;
  }
  $('#clk').title=brk?'Kaffeepause':'Klicken für Uhr-Einstellungen';
}
$('#clk').onclick=()=>{$('#cf').value=CS.h12?'12':'24';$('#cb1').value=CS.b1;$('#cb2').value=CS.b2;$('#cdlg').showModal()};
$('#ccancel').onclick=()=>$('#cdlg').close();
$('#ctest').onclick=()=>{testUntil=Date.now()+8000;$('#cdlg').close();tick()};
$('#cok').onclick=()=>{
  CS={h12:$('#cf').value=='12',b1:$('#cb1').value||'09:30',b2:$('#cb2').value||'15:00'};
  try{localStorage.setItem(CK,JSON.stringify(CS))}catch(e){}
  $('#cdlg').close();tick();
};
tick();setInterval(tick,1000);

load();render();weather();setInterval(weather,15*60*1000);
</script>
</body>
